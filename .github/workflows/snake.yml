name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight
  workflow_dispatch:        # allows manual trigger
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Anand-Bora-0001
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7c3aed&color_dots=#ede9fe,#c4b5fd,#a78bfa,#8b5cf6,#6d28d9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#67e8f9&color_dots=#1e1933,#4c1d95,#7c3aed,#a78bfa,#f9a8d4

      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
